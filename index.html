<!DOCTYPE html>
<html lang="uk">
<head>  
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bringo — Доставка</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --or:#FF5C00;--or2:#FF7A30;--orl:rgba(255,92,0,.13);
  --dark:#0C0C14;--s1:#12121C;--s2:#191926;--s3:#202030;
  --bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.13);
  --t1:#EEEEFF;--t2:#8888AA;--t3:#444468;
  --g:#22C55E;--r:#EF4444;--bl:#60A5FA;
  --nav-h:64px;
}
html,body{height:100%;background:var(--dark);color:var(--t1);font-family:'Nunito',sans-serif;overflow:hidden}

/* PHONE WRAPPER */
.phone{
  width:100%;max-width:420px;height:100dvh;
  margin:0 auto;display:flex;flex-direction:column;
  background:var(--dark);position:relative;overflow:hidden;
}

/* SCROLL AREA */
.scroll-area{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.scroll-area::-webkit-scrollbar{display:none}

/* PAGES */
.page{display:none;padding-bottom:calc(var(--nav-h) + 12px);animation:fadeUp .25s ease}
.page.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* TOP HEADER per page */
.page-header{
  position:sticky;top:0;z-index:30;
  padding:14px 18px 10px;
  background:linear-gradient(to bottom,var(--s1) 80%,transparent);
}
.page-header h1{font-family:'Unbounded',sans-serif;font-size:15px;font-weight:800;color:var(--t1)}
.page-header p{font-size:11px;color:var(--t2);margin-top:2px}

/* SEARCH BAR */
.search-bar{
  margin:0 18px 16px;
  background:var(--s2);border:1.5px solid var(--bd2);
  border-radius:14px;padding:11px 14px;
  display:flex;align-items:center;gap:9px;
  color:var(--t2);font-size:13px;font-weight:600;
}
.search-bar span{font-size:15px}

/* HERO BANNER */
.hero{
  margin:0 18px 20px;
  background:linear-gradient(135deg,#FF5C00 0%,#C83400 100%);
  border-radius:20px;padding:22px 20px;
  position:relative;overflow:hidden;min-height:130px;
  display:flex;align-items:flex-end;
}
.hero::before{content:'🛵';position:absolute;right:-8px;top:-10px;font-size:90px;opacity:.18;transform:rotate(-10deg)}
.hero-content{position:relative;z-index:1}
.hero-content h2{font-family:'Unbounded',sans-serif;font-size:16px;font-weight:800;line-height:1.3;margin-bottom:6px}
.hero-content p{font-size:11px;opacity:.85;margin-bottom:14px}
.hero-btn{
  display:inline-flex;align-items:center;gap:6px;
  background:#fff;color:var(--or);
  border-radius:10px;padding:8px 14px;
  font-family:'Unbounded',sans-serif;font-size:11px;font-weight:700;
}

/* RESTAURANT CARDS */
.rest-scroll{display:flex;gap:12px;padding:0 18px 4px;overflow-x:auto;scrollbar-width:none}
.rest-scroll::-webkit-scrollbar{display:none}
.rest-card{
  flex-shrink:0;width:200px;
  background:var(--s2);border:1px solid var(--bd);border-radius:16px;overflow:hidden;
}
.rc-img{height:110px;background-size:cover;background-position:center;position:relative}
.rc-img-ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.6),transparent 50%)}
.rc-badges{position:absolute;bottom:8px;left:8px;display:flex;gap:5px}
.rc-badge{
  background:rgba(0,0,0,.65);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.12);border-radius:6px;
  padding:3px 7px;font-size:10px;font-weight:700;color:#fff;
}
.rc-badge.or{background:rgba(255,92,0,.85)}
.rc-body{padding:10px 11px}
.rc-name{font-family:'Unbounded',sans-serif;font-size:11px;font-weight:700;margin-bottom:3px}
.rc-meta{font-size:10px;color:var(--t2)}

/* SHOP LIST */
.shop-card{
  display:flex;align-items:center;gap:12px;
  background:var(--s2);border:1px solid var(--bd);border-radius:14px;
  padding:14px;margin:0 18px 10px;
}
.shop-ic{width:44px;height:44px;background:var(--orl);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.shop-info h4{font-family:'Unbounded',sans-serif;font-size:12px;font-weight:700;margin-bottom:2px}
.shop-info p{font-size:10px;color:var(--t2)}

/* BOTTOM NAV */
.bottom-nav{
  height:var(--nav-h);background:var(--s1);border-top:1px solid var(--bd);
  display:flex;align-items:center;flex-shrink:0;
  padding:0 8px;padding-bottom:env(safe-area-inset-bottom);
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;padding:6px 0;border:none;background:none;cursor:pointer;
  color:var(--t3);font-family:'Nunito',sans-serif;transition:.15s;border-radius:12px;
}
.nav-btn.on{color:var(--or)}
.nav-btn .nav-ic{font-size:20px}
.nav-btn span:last-child{font-size:10px;font-weight:700}

/* CART FAB */
.cart-fab{
  position:absolute;bottom:calc(var(--nav-h) + 14px);right:18px;z-index:50;
  background:var(--or);border:none;border-radius:16px;
  display:flex;align-items:center;gap:8px;padding:11px 16px;
  box-shadow:0 6px 24px rgba(255,92,0,.45);cursor:pointer;
  font-family:'Nunito',sans-serif;
}

/* ORDER INPUT AREA */
.order-section { padding: 0 18px; margin-top: 20px; }
.order-textarea {
    width: 100%; height: 100px; background: var(--s2); border: 1px solid var(--bd2);
    border-radius: 14px; color: var(--t1); padding: 12px; font-family: inherit;
    font-size: 14px; outline: none; resize: none;
}
</style>
</head>
<body>

<div class="phone">
  <div class="scroll-area" id="scrollArea">

    <div class="page active" id="pg-home">
      <div class="page-header">
        <h1>BRINGO 🛵</h1>
        <p>Білгород-Дністровський</p>
      </div>

      <div class="hero">
        <div class="hero-content">
          <h2>Доставка всього</h2>
          <p>Напишіть список, і ми привеземо!</p>
        </div>
      </div>

      <div class="order-section">
          <h3 style="font-family:'Unbounded'; font-size:13px; margin-bottom:10px;">Що вам привезти?</h3>
          <textarea id="orderInput" class="order-textarea" placeholder="Наприклад: 2л молока, хліб, бургер з Маестро..."></textarea>
      </div>

      <div style="padding: 18px;">
          <button class="hero-btn" style="width:100%; justify-content:center; padding:15px;" onclick="processOrder()">ОФОРМИТИ ЗАМОВЛЕННЯ</button>
      </div>

      <div class="section" style="margin-top:20px; padding:0 18px">
        <h2 style="font-family:'Unbounded'; font-size:13px; margin-bottom:12px">Популярні заклади</h2>
        <div class="rest-scroll">
            <div class="rest-card">
              <div class="rc-img" style="background-image:url('https://images.unsplash.com/photo-1513104890138-7c749659a591?w=300&q=70')"></div>
              <div class="rc-body"><div class="rc-name">Кафе Маестро</div><div class="rc-meta">⭐ 4.8 · Піца</div></div>
            </div>
            <div class="rest-card">
              <div class="rc-img" style="background-image:url('https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=300&q=70')"></div>
              <div class="rc-body"><div class="rc-name">Кафе Свобода</div><div class="rc-meta">⭐ 4.6 · Гриль</div></div>
            </div>
        </div>
      </div>
    </div>

    <div class="page" id="pg-orders">
      <div class="page-header"><h1>Замовлення</h1></div>
      <div id="orders-list" style="padding:18px; font-size:12px; color:var(--t2); text-align:center;">
          Замовлень поки немає
      </div>
    </div>

  </div><div class="bottom-nav">
    <button class="nav-btn on" id="nb-home" onclick="goPage('home')">
      <div class="nav-ic">🏠</div>
      <span>Головна</span>
    </button>
    <button class="nav-btn" id="nb-orders" onclick="goPage('orders')">
      <div class="nav-ic">📦</div>
      <span>Замовлення</span>
    </button>
  </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCcwGEMEegu3KTDJi7sx4KO_GPHRpPkz5k",
      authDomain: "bringo-b66c2.firebaseapp.com",
      projectId: "bringo-b66c2",
      storageBucket: "bringo-b66c2.firebasestorage.app",
      messagingSenderId: "1015048005239",
      appId: "1:1015048005239:web:1223e81179e30a044ac872",
      measurementId: "G-SY3W7Y8EMY"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const tg = window.Telegram.WebApp;
    tg.expand();

    window.processOrder = async function() {
        const text = document.getElementById('orderInput').value;
        if (!text) {
            tg.showAlert("Будь ласка, напишіть, що ви хочете замовити!");
            return;
        }

        try {
            await addDoc(collection(db, "orders"), {
                user_id: tg.initDataUnsafe?.user?.id || "unknown",
                user_name: tg.initDataUnsafe?.user?.first_name || "Guest",
                order_text: text,
                status: "new",
                timestamp: serverTimestamp()
            });

            tg.sendData(JSON.stringify({ order: text }));
            tg.close();
        } catch (e) {
            console.error("Firebase Error:", e);
            alert("Помилка відправки. Спробуйте ще раз.");
        }
    }
</script>

<script>
// Navigation Logic
const pages={home:'pg-home',orders:'pg-orders'};
const btns={home:'nb-home',orders:'nb-orders'};
let cur='home';

function goPage(id){
  document.getElementById(pages[cur])?.classList.remove('active');
  document.getElementById(btns[cur])?.classList.remove('on');
  cur=id;
  document.getElementById(pages[id])?.classList.add('active');
  document.getElementById(btns[id])?.classList.add('on');
}
</script>

</body>
</html>
