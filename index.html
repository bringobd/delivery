
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bringo | Premium Delivery</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;600;800;900&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-orange': '#FF5C00',
                        'brand-red': '#C02200',
                        'brand-bg': '#050508',
                        'card-bg': 'rgba(21, 21, 30, 0.6)',
                        's1': '#0A0A0F',
                        's2': '#12121A',
                        's3': '#1A1A26',
                        't1': '#F8F8FF',
                        't2': '#94A3B8',
                        't3': '#475569',
                    },
                    fontFamily: {
                        geologica: ['Geologica', 'sans-serif'],
                        nunito: ['Nunito', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        * { 
            -webkit-tap-highlight-color: transparent; 
            outline: none !important;
        }
        html {
            height: 100%;
        }
        body { 
            background-color: #050508; 
            overflow-y: auto; 
            overflow-x: hidden;
            margin: 0; 
            padding: 0; 
            color: #F8F8FF;
            -webkit-font-smoothing: antialiased;
            font-family: 'Nunito', sans-serif;
            width: 100%;
            min-height: 100%;
            -ms-overflow-style: none;  
            scrollbar-width: none;  
        }
        
        body::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .glass {
            background: rgba(18, 18, 26, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transform: translateZ(0); 
            will-change: transform;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translate3d(0, 10px, 0); }
            to { opacity: 1; transform: translate3d(0, 0, 0); }
        }
        
        .animate-reveal { 
            animation: fadeInUp 0.4s ease-out both; 
            will-change: transform, opacity;
        }
        
        .stagger-1 { animation-delay: 0.05s; }
        .stagger-2 { animation-delay: 0.1s; }
        .stagger-3 { animation-delay: 0.15s; }

        .active-scale {
            transition: transform 0.2s ease-out;
            will-change: transform;
        }
        .active-scale:active { 
            transform: scale(0.94) translateZ(0); 
        }
        
        .hero-carousel {
            scroll-snap-type: x mandatory;
            touch-action: pan-x;
            -webkit-overflow-scrolling: touch;
        }

        .mask-horizontal {
            -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
            mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        }

        .nav-indicator-wrapper {
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform;
            pointer-events: none;
        }

        @keyframes slide {
            from { transform: translateX(-100%); }
            to { transform: translateX(100%); }
        }

        .btn-gradient {
            background: linear-gradient(to right, #C02200, #FF5C00);
        }
        
        .btn-gradient:active {
            filter: brightness(0.9);
        }

        @keyframes float {
            0% { transform: translate3d(0, 0, 0); }
            50% { transform: translate3d(0, -10px, 0); }
            100% { transform: translate3d(0, 0, 0); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
            will-change: transform;
        }
    </style>
    <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4",
    "vite": "https://esm.sh/vite@^7.3.1",
    "firebase/": "https://esm.sh/firebase@^12.9.0/",
    "dotenv": "https://esm.sh/dotenv@^17.3.1",
    "node-telegram-bot-api": "https://esm.sh/node-telegram-bot-api@^0.67.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

</body>
</html>
