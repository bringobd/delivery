<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Delivery — B-D</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        :root {
            /* Палитра в стиле Intense Red */
            --deep-red: #8B0000;
            --main-red: #E60000;
            --bright-red: #FF4D4D;
            --dark-bg: #080808;
            --card-bg: #151517;
            --glass-border: rgba(255, 0, 0, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 10px rgba(230, 0, 0, 0.4); }
            50% { box-shadow: 0 0 25px rgba(230, 0, 0, 0.8); }
            100% { box-shadow: 0 0 10px rgba(230, 0, 0, 0.4); }
        }

        @keyframes shimmer {
            0% { left: -150%; }
            100% { left: 150%; }
        }

        body {
            background-color: var(--dark-bg);
            color: #fff;
            padding-bottom: 120px;
        }

        /* Фоновый свет */
        .red-nebula {
            position: fixed;
            top: -20%;
            left: -20%;
            width: 150%;
            height: 150%;
            background: radial-gradient(circle, rgba(139, 0, 0, 0.2) 0%, transparent 40%);
            z-index: -1;
            pointer-events: none;
        }

        /* Header */
        header {
            padding: 40px 20px 20px;
        }

        .location-box {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .location-box i {
            color: var(--main-red);
            font-size: 20px;
        }

        .location-box b {
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .search-container {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-container input {
            background: none;
            border: none;
            color: white;
            font-size: 14px;
            outline: none;
            width: 100%;
        }

        /* Анимированный баннер */
        .banner {
            margin: 20px;
            padding: 40px 25px;
            border-radius: 35px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(-45deg, #8B0000, #E60000, #FF4500, #B22222);
            background-size: 400% 400%;
            animation: gradientFlow 10s ease infinite;
            box-shadow: 0 15px 35px rgba(230, 0, 0, 0.3);
        }

        .banner h1 {
            font-size: 28px;
            font-weight: 900;
            line-height: 1.1;
            position: relative;
            z-index: 2;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .banner .decor-icon {
            position: absolute;
            right: -20px;
            bottom: -20px;
            font-size: 150px;
            color: rgba(0,0,0,0.1);
            transform: rotate(-10deg);
        }

        /* Content Section */
        .section-label {
            padding: 20px;
            font-size: 18px;
            font-weight: 800;
            display: flex;
            justify-content: space-between;
            color: var(--bright-red);
        }

        .restaurant-item {
            margin: 0 20px 25px;
            background: var(--card-bg);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        /* Анимация блеска при наведении/загрузке */
        .restaurant-item::after {
            content: "";
            position: absolute;
            top: 0;
            left: -150%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            animation: shimmer 4s infinite;
        }

        .res-preview {
            width: 100%;
            height: 180px;
            background-size: cover;
            background-position: center;
        }

        .res-info {
            padding: 20px;
        }

        .res-name {
            font-size: 19px;
            font-weight: 800;
            margin-bottom: 8px;
            color: #fff;
        }

        .res-tags {
            font-size: 12px;
            font-weight: 600;
            color: #777;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .res-tag-red {
            color: var(--main-red);
        }

        /* Floating elements */
        .basket-fab {
            position: fixed;
            right: 25px;
            bottom: 110px; /* Над профилем */
            width: 65px;
            height: 65px;
            background: var(--main-red);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            animation: pulseGlow 2s infinite;
            z-index: 1001;
            color: #fff;
        }

        .basket-counter {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #fff;
            color: var(--main-red);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-size: 12px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Bottom TabBar */
        nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.98);
            backdrop-filter: blur(30px);
            padding: 20px 30px 40px;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid var(--glass-border);
            z-index: 1000;
        }

        .tab {
            text-decoration: none;
            color: #444;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .tab.active {
            color: var(--main-red);
        }

        .tab i { font-size: 22px; }
        .tab span { font-size: 11px; font-weight: 700; }

    </style>
</head>
<body>

    <div class="red-nebula"></div>

    <header>
        <div class="location-box">
            <i class="fa-solid fa-map-pin"></i>
            <b>Белгород-Днестровский</b>
        </div>
        <div class="search-container">
            <i class="fa-solid fa-fire-flame-curved" style="color: var(--main-red);"></i>
            <input type="text" placeholder="Что хочешь съесть сейчас?">
        </div>
    </header>

    <div class="banner">
        <h1>ГОЛОД<br>НЕ ПОДОЖДЁТ.<br>МЫ ТОЖЕ.</h1>
        <i class="fa-solid fa-bolt-lightning decor-icon"></i>
    </div>

    <div class="section-label">
        Лучшие в городе
        <i class="fa-solid fa-arrow-trend-up"></i>
    </div>

    <div class="restaurant-list">
        <!-- Ресторан 1 -->
        <div class="restaurant-item">
            <div class="res-preview" style="background-image: url('https://images.unsplash.com/photo-1594000218899-7a017163f80c?q=80&w=500&auto=format&fit=crop');"></div>
            <div class="res-info">
                <div class="res-name">Мясной Статус</div>
                <div class="res-tags">
                    <span class="res-tag-red"><i class="fa-solid fa-star"></i> 5.0</span>
                    <span>300 - 500 ₽</span>
                    <span>15-20 мин</span>
                </div>
            </div>
        </div>

        <!-- Ресторан 2 -->
        <div class="restaurant-item">
            <div class="res-preview" style="background-image: url('https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?q=80&w=500&auto=format&fit=crop');"></div>
            <div class="res-info">
                <div class="res-name">Вкус Аккермана</div>
                <div class="res-tags">
                    <span class="res-tag-red"><i class="fa-solid fa-star"></i> 4.8</span>
                    <span>700 - 1500 ₽</span>
                    <span>40-45 мин</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Корзина над Профилем с пульсацией -->
    <div class="basket-fab">
        <i class="fa-solid fa-hand-holding-heart"></i>
        <div class="basket-counter">1</div>
    </div>

    <!-- Главная панель навигации -->
    <nav>
        <a href="#" class="tab active">
            <i class="fa-solid fa-house-user"></i>
            <span>Главная</span>
        </a>
        <a href="#" class="tab">
            <i class="fa-solid fa-list-ul"></i>
            <span>Кафе</span>
        </a>
        <a href="#" class="tab">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>История</span>
        </a>
        <a href="#" class="tab">
            <i class="fa-solid fa-shield-cat"></i>
            <span>Профиль</span>
        </a>
    </nav>

</body>
</html>
