<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bringo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@500;700;800;900&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@^19.2.4",
          "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
          "react/": "https://esm.sh/react@^19.2.4/"
        }
      }
    </script>
    <style>
      :root {
        --or: #FF5C00;
        --orl: rgba(255, 92, 0, .13);
        --orb: rgba(255, 92, 0, .3);
        --accent: #8B5CF6;
        --accent-l: rgba(139, 92, 246, 0.15);
        --accent-b: rgba(139, 92, 246, 0.4);
        --bg: #08080F;
        --s1: #0F0F18;
        --s2: #151520;
        --s3: #1A1A28;
        --bd: rgba(255, 255, 255, .06);
        --bd2: rgba(255, 255, 255, .11);
        --t1: #EEEEFF;
        --t2: #6868A0;
        --t3: #303050;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: var(--bg);
        font-family: 'Nunito', sans-serif;
        color: var(--t1);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .app-container {
        max-width: 1280px;
        margin: 0 auto;
      }
      main {
        padding: 1rem 0;
      }
      .header {
        background: rgba(15, 15, 24, 0.8);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--bd);
        padding: 1rem 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 50;
      }
      .logo {
        font-family: 'Geologica', sans-serif;
        font-size: 28px;
        font-weight: 900;
        color: var(--or);
        letter-spacing: -1.5px;
        text-decoration: none;
      }
      .nav-links { display: flex; gap: 2rem; }
      .nav-links a {
        color: var(--t2);
        font-weight: 700;
        font-size: 14px;
        text-decoration: none;
        transition: color 0.2s;
      }
      .nav-links a:hover { color: var(--or); }
      .header-actions { display: flex; align-items: center; gap: 1rem; }
      .btn {
        font-family: 'Geologica', sans-serif;
        font-weight: 800;
        font-size: 14px;
        border-radius: 12px;
        padding: 10px 20px;
        cursor: pointer;
        transition: all 0.2s;
        border: none;
      }
      .btn-secondary {
        background: transparent;
        color: var(--t2);
      }
      .btn-secondary:hover { color: var(--t1); }
      .btn-primary {
        background: linear-gradient(45deg, var(--or), #ff8c4c);
        color: white;
        box-shadow: 0 0 15px var(--orb);
      }
      .btn-primary:hover {
        transform: scale(1.03);
        box-shadow: 0 0 25px rgba(255, 92, 0, 0.5);
      }
      .cart-btn {
        background: var(--s3);
        color: var(--t1);
        font-size: 18px;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--bd2);
        cursor: pointer;
        transition: all 0.2s;
      }
      .cart-btn:hover { border-color: var(--accent); background: var(--accent-l); color: var(--accent); }
      .hero {
        margin: 2rem;
        border-radius: 22px;
        background-image: linear-gradient(rgba(8, 8, 15, 0.8), rgba(8, 8, 15, 0.8)), url('https://images.unsplash.com/photo-1531215535926-2a8155e8242f?w=1280&q=80');
        background-size: cover;
        background-position: center;
        padding: 3rem;
        position: relative;
        overflow: hidden;
        text-align: center;
      }
      .hero::before {
        content: '🛵';
        position: absolute;
        right: 10px;
        top: -10px;
        font-size: 140px;
        opacity: .12;
        transform: rotate(-7deg);
        pointer-events: none;
      }
      .hero h1 {
        font-family: 'Geologica', sans-serif;
        font-size: 48px;
        font-weight: 900;
        line-height: 1.2;
        margin-bottom: 1rem;
        color: white;
        text-shadow: 0 0 15px var(--or), 0 0 25px var(--orb);
      }
      .hero p {
        font-size: 18px;
        color: rgba(255,255,255,0.8);
        margin-bottom: 2rem;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
      }
      .search-bar {
        position: relative;
        max-width: 500px;
        margin: 0 auto;
      }
      .search-input {
        width: 100%;
        background: rgba(0,0,0,0.2);
        border: 1.5px solid rgba(255,255,255,0.2);
        border-radius: 13px;
        padding: 14px 20px;
        font-size: 16px;
        font-weight: 600;
        color: var(--t1);
        outline: none;
        font-family: 'Nunito', sans-serif;
        transition: all .2s;
      }
      .search-input::placeholder { color: rgba(255,255,255,0.4); }
      .search-input:focus {
        border-color: var(--accent);
        background: rgba(0,0,0,0.3);
        box-shadow: 0 0 15px var(--accent-b);
      }
      .section { padding: 1rem 2rem 3rem; }
      .section-title {
        font-family: 'Geologica', sans-serif;
        font-size: 28px;
        font-weight: 800;
        text-align: center;
        margin-bottom: 2rem;
      }
      .restaurants-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 2rem;
      }
      .restaurant-card {
        background: var(--s2);
        border: 1px solid var(--bd);
        border-radius: 17px;
        overflow: hidden;
        cursor: pointer;
        transition: all .2s ease-in-out;
      }
      .restaurant-card:hover {
        transform: translateY(-5px);
        border-color: var(--orb);
        box-shadow: 0 0 25px var(--orb);
      }
      .rc-img {
        height: 180px;
        background-size: cover;
        background-position: center;
        position: relative;
      }
      .rc-ov {
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(21, 21, 32, 1), transparent 70%);
      }
      .rc-badge {
        position: absolute;
        bottom: 8px;
        left: 8px;
        background: rgba(0,0,0,.72);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255,255,255,.1);
        border-radius: 7px;
        padding: 4px 10px;
        font-size: 12px;
        font-weight: 700;
      }
      .rc-body { padding: 1rem; }
      .rc-name {
        font-family: 'Geologica', sans-serif;
        font-size: 18px;
        font-weight: 800;
        margin-bottom: 5px;
      }
      .rc-meta { font-size: 14px; color: var(--t2); }
      .rc-meta-icon {
        color: #FBBF24; /* amber-400 */
        margin-right: 4px;
        font-size: 12px;
      }
      .footer {
        background: var(--s1);
        border-top: 1px solid var(--bd);
        color: var(--t2);
        padding: 3rem 2rem 2rem;
      }
      .footer-content {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 2rem;
        margin-bottom: 2rem;
      }
      .footer-col h4 {
        font-family: 'Geologica', sans-serif;
        font-weight: 800;
        color: var(--t1);
        margin-bottom: 1rem;
      }
      .footer-col ul { list-style: none; }
      .footer-col li { margin-bottom: 0.5rem; }
      .footer-col a { color: var(--t2); text-decoration: none; transition: color 0.2s; }
      .footer-col a:hover { color: var(--or); }
      .social-icons { display: flex; gap: 1rem; }
      .social-icons a { font-size: 20px; }
      .footer-bottom {
        border-top: 1px solid var(--bd2);
        padding-top: 1.5rem;
        text-align: center;
        font-size: 14px;
        color: var(--t3);
      }

      /* --- RESPONSIVE STYLES --- */

      /* Tablet */
      @media (max-width: 1024px) {
        .header { padding: 1rem 1.5rem; }
        .nav-links { gap: 1.5rem; }
        .hero { margin: 1.5rem; padding: 2.5rem; }
        .hero h1 { font-size: 38px; }
        .hero p { font-size: 16px; }
        .section { padding: 1rem 1.5rem 2rem; }
        .section-title { font-size: 24px; }
      }

      /* Mobile */
      @media (max-width: 768px) {
        .header {
          padding: 1rem;
        }
        .logo { font-size: 24px; }
        .nav-links { display: none; }
        .header-actions { gap: 0.5rem; }
        .btn { padding: 8px 14px; font-size: 12px; }
        .btn-secondary { display: none; }
        .cart-btn { width: 40px; height: 40px; font-size: 16px; }

        .hero {
          margin: 1rem;
          padding: 2rem 1.5rem;
          border-radius: 18px;
        }
        .hero::before {
          font-size: 100px;
          right: -10px;
          top: -20px;
        }
        .hero h1 {
          font-size: 28px;
          margin-bottom: 0.75rem;
        }
        .hero p {
          font-size: 14px;
          margin-bottom: 1.5rem;
        }
        .search-input {
          padding: 12px 16px;
          font-size: 14px;
        }

        .section { padding: 1.5rem 1rem; }
        .restaurants-grid {
          grid-template-columns: 1fr;
          gap: 1rem;
        }
        .rc-img { height: 160px; }

        .footer-content {
          grid-template-columns: 1fr;
          text-align: center;
        }
        .social-icons {
          justify-content: center;
        }
      }
    </style>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
