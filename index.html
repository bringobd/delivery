<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire Fusion — Доставка Аккерман</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        :root {
            --primary: linear-gradient(135deg, #FF0000 0%, #FF8C00 100%);
            --red: #FF0000;
            --orange: #FF8C00;
            --bg-grad: linear-gradient(180deg, #050505 0%, #1a0202 50%, #201005 100%);
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-grad);
            background-attachment: fixed;
            color: #fff;
            min-height: 100vh;
            padding-bottom: 130px;
            overflow-x: hidden;
        }

        /* --- АНІМАЦІЇ --- */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseCart {
            0% { box-shadow: 0 10px 20px rgba(255, 0, 0, 0.3); transform: scale(1); }
            50% { box-shadow: 0 15px 35px rgba(255, 69, 0, 0.6); transform: scale(1.05); }
            100% { box-shadow: 0 10px 20px rgba(255, 0, 0, 0.3); transform: scale(1); }
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .page { display: none; animation: fadeInUp 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
        .page.active { display: block; }

        /* --- HEADER --- */
        header { padding: 40px 20px 10px; }

        .location {
            font-size: 13px;
            font-weight: 800;
            color: var(--orange);
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .search-box {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            padding: 16px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(10px);
        }
        .search-box input { background: none; border: none; color: #fff; width: 100%; outline: none; }

        /* Banner */
        .banner {
            margin: 20px;
            padding: 45px 25px;
            border-radius: 35px;
            background: var(--primary);
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(255, 0, 0, 0.25);
        }
        .banner h1 { font-size: 24px; font-weight: 900; line-height: 1.2; position: relative; z-index: 2; }
        .banner-icon { position: absolute; right: -15px; bottom: -15px; font-size: 140px; opacity: 0.15; transform: rotate(-10deg); }

        /* --- ГОРИЗОНТАЛЬНИЙ СКРОЛЛ З ДВОСТОРОННІМ ГРАДІЄНТОМ --- */
        .h-scroll-wrapper {
            position: relative;
            width: 100%;
            /* Градієнтна маска з обох боків */
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 10%, black 90%, transparent 100%);
            mask-image: linear-gradient(to right, transparent 0%, black 10%, black 90%, transparent 100%);
        }

        .h-scroll {
            display: flex;
            overflow-x: auto;
            padding: 15px 20px 25px;
            gap: 18px;
            scrollbar-width: none;
        }
        .h-scroll::-webkit-scrollbar { display: none; }

        .res-card-h {
            min-width: 280px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            overflow: hidden;
            backdrop-filter: blur(5px);
            transition: 0.3s;
        }
        .res-card-h:active { transform: scale(0.96); }

        .res-img { height: 160px; background-size: cover; background-position: center; position: relative; }
        
        .rating-tag {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.6);
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 800;
            color: #FFD700;
            backdrop-filter: blur(8px);
        }
        .res-info { padding: 20px; }
        .res-info h3 { font-size: 18px; font-weight: 800; margin-bottom: 5px; }
        .res-info p { font-size: 12px; color: #aaa; }

        .section-title { padding: 0 20px; font-size: 20px; font-weight: 900; margin-top: 15px; }

        /* У розробці */
        .dev-block {
            margin: 20px;
            padding: 50px;
            background: rgba(255,255,255,0.03);
            border: 2px dashed rgba(255,255,255,0.08);
            border-radius: 35px;
            text-align: center;
            color: #333;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* --- Вкладка Кафе --- */
        .v-list { padding: 20px; }
        .res-card-v {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            overflow: hidden;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            transition: 0.2s;
        }
        .res-card-v:active { transform: scale(0.98); background: rgba(255,255,255,0.12); }
        .res-card-v .res-img-v { width: 100px; height: 100px; background-size: cover; background-position: center; }
        .res-card-v .res-info-v { padding: 15px; flex: 1; }

        /* --- Вкладка Профіль --- */
        .profile-box { padding: 30px 20px; }
        .user-card { background: var(--primary); padding: 30px; border-radius: 35px; display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
        .user-avatar { width: 65px; height: 65px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--red); font-size: 26px; }
        .menu-link { background: var(--glass); border: 1px solid var(--glass-border); padding: 22px; border-radius: 25px; display: flex; justify-content: space-between; margin-bottom: 15px; font-weight: 700; }

        /* --- КОШИК НАД ПРОФІЛЕМ --- */
        #cart-fab {
            position: fixed;
            right: 30px;
            bottom: 120px;
            width: 65px;
            height: 65px;
            background: var(--primary);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            z-index: 1000;
            animation: pulseCart 3s infinite;
        }

        /* --- НИЖНЯ ПАНЕЛЬ (Рідке скло) --- */
        nav {
            position: fixed;
            bottom: 25px;
            left: 20px;
            right: 20px;
            height: 75px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 35px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 999;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .nav-tab { text-decoration: none; color: rgba(255, 255, 255, 0.3); display: flex; flex-direction: column; align-items: center; gap: 4px; transition: 0.3s; width: 60px; }
        .nav-tab.active { color: #fff; transform: translateY(-5px); }
        .nav-tab.active i { background: var(--primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 8px rgba(255, 140, 0, 0.4)); }
        .nav-tab i { font-size: 24px; }
        .nav-tab span { font-size: 9px; font-weight: 800; text-transform: uppercase; }
        .nav-tab.active::after { content: ''; position: absolute; bottom: -10px; width: 5px; height: 5px; background: var(--orange); border-radius: 50%; box-shadow: 0 0 10px var(--orange); }

    </style>
</head>
<body>

    <!-- ГОЛОВНА -->
    <div id="main" class="page active">
        <header>
            <div class="location"><i class="fa-solid fa-location-dot"></i> Білгород-Дністровський</div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass" style="opacity: 0.3"></i>
                <input type="text" placeholder="Пошук їжі...">
            </div>
        </header>

        <div class="banner">
            <h1>ЛЕГЕНДАРНИЙ СМАК.<br>БЛИСКАВИЧНИЙ ШЛЯХ.</h1>
            <i class="fa-solid fa-bolt-lightning banner-icon"></i>
        </div>

        <div class="section-title">Ресторани</div>
        
        <div class="h-scroll-wrapper">
            <div class="h-scroll" id="h-scroll-container">
                <!-- Ресторани завантажаться з JS -->
            </div>
        </div>

        <div class="section-title">Магазини</div>
        <div class="dev-block">У розробці</div>
    </div>

    <!-- КАФЕ -->
    <div id="cafes" class="page">
        <header><h1 class="section-title" style="padding:0">Усі заклади</h1></header>
        <div class="v-list" id="v-list-container"></div>
    </div>

    <!-- ЗАМОВЛЕННЯ -->
    <div id="orders" class="page">
        <div style="text-align: center; padding: 150px 40px;">
            <i class="fa-solid fa-receipt" style="font-size: 60px; color: #111;"></i>
            <h2 style="margin-top: 20px; font-weight: 900;">ЗАМОВЛЕНЬ НЕМАЄ</h2>
            <p style="color: #444; margin-top: 10px; font-weight: 600;">Тут будуть ваші замовлення</p>
        </div>
    </div>

    <!-- ПРОФІЛЬ -->
    <div id="profile" class="page">
        <div class="profile-box">
            <div class="user-card">
                <div class="user-avatar"><i class="fa-solid fa-user-astronaut"></i></div>
                <div><h2 style="font-weight: 900">АККЕРМАНЕЦЬ</h2><p style="opacity: 0.7; font-size: 12px">Преміум статус</p></div>
            </div>
            <div class="menu-link"><span>Обране</span> <i class="fa-solid fa-heart" style="color: var(--orange)"></i></div>
            <div class="menu-link"><span>Адреси</span> <i class="fa-solid fa-map-pin" style="color: var(--orange)"></i></div>
            <div class="menu-link"><span>Налаштування</span> <i class="fa-solid fa-sliders" style="color: var(--orange)"></i></div>
        </div>
    </div>

    <!-- КОШИК -->
    <div id="cart-fab">
        <i class="fa-solid fa-cart-shopping"></i>
    </div>

    <!-- ПАНЕЛЬ НАВІГАЦІЇ -->
    <nav>
        <a href="javascript:void(0)" class="nav-tab active" onclick="showPage('main', this)">
            <i class="fa-solid fa-house-chimney-window"></i>
            <span>Головна</span>
        </a>
        <a href="javascript:void(0)" class="nav-tab" onclick="showPage('cafes', this)">
            <i class="fa-solid fa-utensils"></i>
            <span>Кафе</span>
        </a>
        <a href="javascript:void(0)" class="nav-tab" onclick="showPage('orders', this)">
            <i class="fa-solid fa-clipboard-list"></i>
            <span>Замовлення</span>
        </a>
        <a href="javascript:void(0)" class="nav-tab" onclick="showPage('profile', this)">
            <i class="fa-solid fa-user-tie"></i>
            <span>Профіль</span>
        </a>
    </nav>

    <script>
        const restaurants = [
            { id: 1, name: 'Кафе Маестро', image: 'https://lh3.googleusercontent.com/gps-cs-s/AHVAwer7zoR2kbht6bkSZJLZctjnDdWupbkRKmODGHyz9xSRMEuxJa53xCRP3AmivXaspetZclRfkwyIRgzg4jncA-kGRXmtnKVyk1OYN4x4ydSJjt43c13hR1xQwc6XraNHJe_v7KAV=w408-h306-k-no', rating: 4.8, cuisine: 'Піца, Суші, Мангал' },
            { id: 2, name: 'СВОБОДА', image: 'https://lh3.googleusercontent.com/p/AF1QipPsLzVNvrFrEtqQtTJv1OrBp0nDjO7djl6A46EO=s680-w680-h510-rw', rating: 4.5, cuisine: 'Європейська, Українська' },
            { id: 3, name: 'Smoke Time', image: 'https://lh3.googleusercontent.com/gps-cs-s/AHVAweqfkfSIzNBC1xWFoGHRx_-JrhFoMStYdlfGb56zLqhkIV9czSwmafqmkZNfLr3RFxNMMxhDlwd31MxtCtcdcJsoTrL5zd0KU9bdpLSsYLMQuvGzYtMRawpoEYaM5dB49GjjbLg1wkHWTlR9=w408-h544-k-no', rating: 4.7, cuisine: 'Кальян, Напої, Закуски' },
            { id: 4, name: 'Food house', image: 'https://lh3.googleusercontent.com/p/AF1QipMROLILFzLckulWfZJxirh0kQaEHRxqYUIRLyQL=w408-h408-k-no', rating: 4.6, cuisine: 'Фаст-фуд, Шаурма' },
            { id: 5, name: 'Mama Mia', image: 'https://lh3.googleusercontent.com/p/AF1QipN7D_iLbUOW5TFybEIzwnIcFZT_5B0usif9h4b-=w426-h240-k-no', rating: 4.9, cuisine: 'Італійська, Піца' },
            { id: 6, name: 'Піцерія La Mila', image: 'https://lh3.googleusercontent.com/gps-cs-s/AHVAweqMeu6NOMHlsVK8qoyJBW9XHL1IcvLbx4BGPPvXq64O9d3DvltG0YRpLxaEr0dKT7tLhMbapl2uPHUT7IfnwlQj92_mRD2tWl6HW7SLWHxPEs35N3Kuai3hibOyJeaIGTm0t8hsRQUxv_Q=w408-h544-k-no', rating: 4.7, cuisine: 'Піца, Паста' },
            { id: 7, name: 'ДАХ АККЕРМАН', image: 'https://lh3.googleusercontent.com/p/AF1QipOMlCR2AA_IJY8CoNUeEZQGNlWCa88dHEq2qorO=w408-h612-k-no', rating: 4.8, cuisine: 'Ресторан, Європейська' },
            { id: 8, name: 'Маестро (Перемога)', image: 'https://lh3.googleusercontent.com/p/AF1QipOIirOKsjsCJgNiePNF0x9szxYM4-OKM03j9O30=w408-h544-k-no', rating: 4.8, cuisine: 'Кафе, Десерти' }
        ];

        function init() {
            const hContainer = document.getElementById('h-scroll-container');
            const vContainer = document.getElementById('v-list-container');
            
            restaurants.forEach((res, index) => {
                // Плавна затримка появи для кожної картки
                const delay = index * 0.1;

                hContainer.innerHTML += `
                    <div class="res-card-h" style="animation: fadeInUp 0.5s ease ${delay}s both">
                        <div class="res-img" style="background-image: url('${res.image}')"><div class="rating-tag">⭐ ${res.rating}</div></div>
                        <div class="res-info"><h3>${res.name}</h3><p>${res.cuisine}</p></div>
                    </div>
                `;
                vContainer.innerHTML += `
                    <div class="res-card-v" style="animation: fadeInUp 0.5s ease ${delay}s both">
                        <div class="res-img-v" style="background-image: url('${res.image}')"></div>
                        <div class="res-info-v"><h3>${res.name}</h3><p style="font-size:11px; color:#666">${res.cuisine}</p></div>
                    </div>
                `;
            });
        }

        function showPage(id, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            
            const cart = document.getElementById('cart-fab');
            if(id === 'profile' || id === 'orders') {
                cart.style.opacity = '0.3';
                cart.style.transform = 'scale(0.8) translateY(20px)';
            } else {
                cart.style.opacity = '1';
                cart.style.transform = 'scale(1) translateY(0)';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        init();
    </script>
</body>
</html>
