<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bringo — Доставка</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --or:#FF5C00;--or2:#FF7530;--orl:rgba(255,92,0,.13);--orb:rgba(255,92,0,.3);
  --dark:#0C0C14;--s1:#12121C;--s2:#191926;--s3:#202030;--s4:#282840;
  --bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.13);
  --t1:#EEEEFF;--t2:#8888AA;--t3:#444468;
  --g:#22C55E;--gl:rgba(34,197,94,.14);
  --r:#EF4444;--rl:rgba(239,68,68,.14);
  --y:#F59E0B;--yl:rgba(245,158,11,.14);
  --bl:#60A5FA;--bll:rgba(96,165,250,.14);
  --sw:260px;
}
html,body{height:100%;overflow:hidden}
body{font-family:'Nunito',sans-serif;background:var(--dark);color:var(--t1);display:flex}

/* LOADING */
#loadingScreen{position:fixed;inset:0;background:var(--dark);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
#loadingScreen .logo{font-family:'Unbounded',sans-serif;font-size:28px;font-weight:800;color:var(--or)}
#loadingScreen .spinner{width:36px;height:36px;border:3px solid var(--bd2);border-top-color:var(--or);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* AUTH */
#authScreen{position:fixed;inset:0;background:var(--dark);z-index:998;display:none;align-items:center;justify-content:center}
.aw{width:380px;background:var(--s1);border:1px solid var(--bd2);border-radius:20px;padding:32px;position:relative;overflow:hidden}
.aw::before{content:'';position:absolute;top:-50px;right:-50px;width:160px;height:160px;background:radial-gradient(circle,rgba(255,92,0,.22),transparent 70%);border-radius:50%}
.aw-logo{font-family:'Unbounded',sans-serif;font-size:22px;font-weight:800;margin-bottom:3px;color:var(--or)}
.aw-sub{font-size:12px;color:var(--t2);margin-bottom:24px}
.af{margin-bottom:13px}
.af label{display:block;font-size:11px;font-weight:700;color:var(--t2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.8px}
.af input{width:100%;padding:11px 13px;background:var(--s2);border:1.5px solid var(--bd2);border-radius:10px;color:var(--t1);font-size:13px;font-family:'Nunito',sans-serif;outline:none;transition:.18s}
.af input:focus{border-color:var(--or)}
.af input::placeholder{color:var(--t3)}
.a-btn{width:100%;padding:12px;background:var(--or);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:800;cursor:pointer;font-family:'Unbounded',sans-serif;transition:.18s;margin-top:4px}
.a-btn:hover{background:var(--or2);transform:translateY(-1px)}
.a-err{font-size:12px;color:var(--r);text-align:center;margin-top:9px;min-height:14px}
.a-hint{font-size:11px;color:var(--t3);margin-top:12px;background:var(--s2);border-radius:8px;padding:10px 12px;line-height:1.8}
.a-hint b{color:var(--t2)}

#appWrap{display:flex;height:100vh;width:100%}
.sb{width:var(--sw);background:var(--s1);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:20px 13px;flex-shrink:0;height:100vh;overflow-y:auto}
.sb-logo{font-family:'Unbounded',sans-serif;font-size:18px;font-weight:800;color:var(--or);padding:2px 9px 24px}
.sb-logo small{display:block;font-size:9px;font-weight:500;color:var(--t3);margin-top:1px;letter-spacing:1.2px;text-transform:uppercase;font-family:'Nunito',sans-serif}
.ng{margin-bottom:16px}
.ng-lbl{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:var(--t3);font-weight:700;padding:0 9px;margin-bottom:5px}
.nl{display:flex;align-items:center;gap:10px;padding:9px 9px;border-radius:10px;cursor:pointer;color:var(--t2);font-size:13px;font-weight:600;transition:.13s;margin-bottom:1px;border:none;background:none;width:100%;text-align:left;font-family:'Nunito',sans-serif}
.nl:hover{background:var(--bd);color:var(--t1)}
.nl.on{background:var(--orl);color:var(--or);font-weight:700}
.nl .ic{font-size:15px;width:19px;text-align:center;flex-shrink:0}
.nl .bdg{margin-left:auto;background:var(--or);color:#fff;font-size:10px;font-weight:900;padding:1px 6px;border-radius:20px;min-width:18px;text-align:center;display:none}
.nl .bdg.show{display:inline-block}
.nl .bdg.green{background:var(--g)}
.sb-bot{margin-top:auto;padding-top:12px}
.sb-user{padding:11px;background:var(--s2);border:1px solid var(--bd);border-radius:11px;display:flex;align-items:center;gap:9px;margin-bottom:7px}
.sb-av{width:32px;height:32px;background:var(--orl);border:2px solid var(--or);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.sb-inf{flex:1;min-width:0}
.sb-nm{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-rl{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.5px}
.lo-btn{width:100%;padding:8px;background:none;border:1.5px solid var(--bd2);border-radius:9px;color:var(--t2);font-size:12px;font-weight:600;cursor:pointer;font-family:'Nunito',sans-serif;transition:.13s}
.lo-btn:hover{border-color:var(--r);color:var(--r)}

.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;height:100vh}
.topbar{padding:13px 28px;background:var(--s1);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:40;flex-shrink:0}
.srch{flex:1;max-width:420px;background:var(--s2);border:1.5px solid var(--bd);border-radius:10px;padding:9px 13px;display:flex;align-items:center;gap:8px;transition:.17s;position:relative}
.srch:focus-within{border-color:var(--orb)}
.srch input{background:none;border:none;color:var(--t1);font-size:13px;outline:none;width:100%;font-family:'Nunito',sans-serif}
.srch input::placeholder{color:var(--t3)}
.srch-drop{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--s1);border:1px solid var(--bd2);border-radius:12px;overflow:hidden;z-index:200;display:none;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.srch-drop.show{display:block}
.srch-item{display:flex;align-items:center;gap:11px;padding:10px 14px;cursor:pointer;transition:.13s}
.srch-item:hover{background:var(--s2)}
.srch-item .si-ic{width:36px;height:36px;border-radius:9px;background-size:cover;background-position:center;flex-shrink:0;background-color:var(--s3);display:flex;align-items:center;justify-content:center;font-size:16px}
.srch-item .si-info h4{font-size:13px;font-weight:700;margin-bottom:1px}
.srch-item .si-info p{font-size:11px;color:var(--t2)}
.srch-item .si-type{margin-left:auto;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
.srch-item .si-type.rest{background:var(--orl);color:var(--or)}
.srch-item .si-type.shop{background:var(--bll);color:var(--bl)}
.srch-sep{padding:6px 14px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);background:var(--s2)}
.city{display:flex;align-items:center;gap:5px;padding:7px 12px;background:var(--s2);border:1px solid var(--bd);border-radius:9px;font-size:12px;font-weight:600;color:var(--t2);flex-shrink:0}

.cart-btn{display:flex;align-items:center;gap:0;border:none;cursor:pointer;font-family:'Nunito',sans-serif;transition:all .2s cubic-bezier(.4,0,.2,1);border-radius:12px;overflow:hidden;flex-shrink:0}
.cart-btn.empty{background:var(--s2);border:1.5px solid var(--bd2);padding:9px 14px;color:var(--t2);font-size:13px;font-weight:700;gap:7px}
.cart-btn.empty:hover{border-color:var(--orb);color:var(--t1)}
.cart-btn.filled{background:var(--or);padding:0;box-shadow:0 4px 16px rgba(255,92,0,.35)}
.cart-btn.filled:hover{background:var(--or2);transform:translateY(-1px)}
.cart-btn.filled .cart-icon-wrap{padding:10px 13px;font-size:16px;border-right:1px solid rgba(255,255,255,.2)}
.cart-btn.filled .cart-label{padding:10px 14px;font-size:13px;font-weight:800;color:#fff;font-family:'Unbounded',sans-serif;white-space:nowrap}
.cart-btn.filled .cart-cnt-wrap{background:rgba(0,0,0,.2);padding:10px 12px 10px 0;display:flex;align-items:center}
.cart-cnt{background:rgba(255,255,255,.25);color:#fff;font-size:11px;font-weight:900;border-radius:6px;min-width:22px;height:22px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-family:'Unbounded',sans-serif}
@keyframes cartBump{0%{transform:scale(1)}40%{transform:scale(1.12)}70%{transform:scale(.96)}100%{transform:scale(1)}}
.cart-btn.bump{animation:cartBump .3s ease}

.pg{display:none;animation:fi .18s ease}
.pg.on{display:block}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.w{padding:22px 28px 100px}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.sh h2{font-family:'Unbounded',sans-serif;font-size:15px;font-weight:700}

.hero{background:linear-gradient(130deg,#FF5C00 0%,#C83400 100%);border-radius:16px;padding:28px 32px;display:flex;align-items:center;justify-content:space-between;overflow:hidden;position:relative;margin-bottom:22px}
.hero::after{content:'';position:absolute;right:-20px;top:-20px;width:200px;height:200px;background:rgba(255,255,255,.06);border-radius:50%}
.ht{position:relative;z-index:1}
.ht h1{font-family:'Unbounded',sans-serif;font-size:20px;font-weight:800;line-height:1.3;margin-bottom:8px}
.ht p{font-size:13px;opacity:.85;margin-bottom:16px}
.hcta{background:#fff;color:var(--or);border:none;border-radius:9px;padding:10px 18px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:12px;cursor:pointer;transition:.17s}
.hcta:hover{transform:scale(1.04)}
.hem{font-size:54px;position:relative;z-index:1;line-height:1}
.promo-row{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:22px}
.pm{border-radius:13px;padding:15px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:.15s}
.pm:hover{transform:scale(1.02)}
.pm.p1{background:linear-gradient(135deg,#FF5C00,#FF8830)}
.pm.p2{background:linear-gradient(135deg,#6C3FFF,#9B67FF)}
.pm.p3{background:linear-gradient(135deg,#0EA5E9,#38BDF8)}
.pm h4{font-family:'Unbounded',sans-serif;font-size:12px;font-weight:700;margin-bottom:2px}
.pm p{font-size:11px;opacity:.82}
.pm .em{font-size:28px}

.rest-card{background:var(--s2);border-radius:14px;overflow:hidden;border:1px solid var(--bd);transition:.19s;cursor:pointer;display:flex;flex-direction:column}
.rest-card:hover{border-color:var(--orb);transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.3)}
.rc-img-wrap{position:relative;height:140px}
.rc-img{height:100%;width:100%;background-size:cover;background-position:center}
.rc-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.7) 0%,transparent 55%)}
.rc-time-badge{position:absolute;bottom:9px;left:9px;display:flex;gap:6px;align-items:center}
.rc-tb{background:rgba(0,0,0,.65);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);border-radius:7px;padding:4px 9px;font-size:11px;font-weight:700;color:#fff;display:flex;align-items:center;gap:4px}
.rc-tb.orange{background:rgba(255,92,0,.8);border-color:rgba(255,92,0,.5)}
.rc-body{padding:13px}
.rc-name{font-family:'Unbounded',sans-serif;font-size:13px;font-weight:700;margin-bottom:5px}
.rc-meta{font-size:11px;color:var(--t2);margin-bottom:11px}
.rc-btn{width:100%;padding:9px;background:var(--or);border:none;color:#fff;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;transition:.15s}
.rc-btn:hover{background:var(--or2)}

.shop-link{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--s2);border:1px solid var(--bd);border-radius:13px;text-decoration:none;color:var(--t1);transition:.15s;margin-bottom:10px}
.shop-link:hover{border-color:var(--orb);transform:translateX(3px)}
.sl-ic{width:44px;height:44px;border-radius:11px;background:var(--orl);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.sl-info h4{font-family:'Unbounded',sans-serif;font-size:13px;font-weight:700;margin-bottom:2px}
.sl-info p{font-size:11px;color:var(--t2)}
.sl-arr{margin-left:auto;color:var(--t3);font-size:16px}

.rest-pg-hd{background:var(--s2);border-radius:14px;overflow:hidden;border:1px solid var(--bd);margin-bottom:20px}
.rest-pg-banner{height:200px;background-size:cover;background-position:center;position:relative}
.rest-pg-banner-ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,10,20,.9) 0%,transparent 55%)}
.rest-pg-info{padding:18px 20px}
.rest-pg-name{font-family:'Unbounded',sans-serif;font-size:18px;font-weight:800;margin-bottom:8px}
.rest-pg-meta{display:flex;gap:8px;flex-wrap:wrap}
.rest-pg-chip{display:flex;align-items:center;gap:5px;background:var(--s3);border:1px solid var(--bd);border-radius:8px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--t2)}
.rest-pg-chip.or{background:var(--orl);border-color:var(--orb);color:var(--or)}
.rest-pg-chip.g{background:var(--gl);border-color:rgba(34,197,94,.3);color:var(--g)}
.back-btn{display:flex;align-items:center;gap:7px;padding:8px 14px;background:var(--s2);border:1px solid var(--bd);border-radius:9px;color:var(--t2);font-size:12px;font-weight:700;cursor:pointer;margin-bottom:16px;transition:.13s;font-family:'Nunito',sans-serif}
.back-btn:hover{border-color:var(--orb);color:var(--t1)}
.cat-tabs{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;margin-bottom:20px;scrollbar-width:none}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{padding:7px 15px;background:var(--s2);border:1.5px solid var(--bd);border-radius:20px;font-size:12px;font-weight:700;color:var(--t2);cursor:pointer;white-space:nowrap;transition:.15s;flex-shrink:0}
.cat-tab:hover{border-color:var(--orb);color:var(--t1)}
.cat-tab.on{background:var(--orl);border-color:var(--or);color:var(--or)}
.cat-section-hd{font-family:'Unbounded',sans-serif;font-size:11px;font-weight:700;color:var(--t2);margin:20px 0 12px;text-transform:uppercase;letter-spacing:.8px}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:8px}
.mg-card{background:var(--s2);border:1px solid var(--bd);border-radius:12px;overflow:hidden;transition:.16s}
.mg-card:hover{border-color:var(--orb);transform:translateY(-2px)}
.mg-img{height:120px;background-size:cover;background-position:center;background-color:var(--s3)}
.mg-body{padding:11px 12px}
.mg-name{font-size:13px;font-weight:700;margin-bottom:3px}
.mg-desc{font-size:11px;color:var(--t2);line-height:1.35;margin-bottom:9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mg-foot{display:flex;align-items:center;justify-content:space-between}
.mg-price{font-family:'Unbounded',sans-serif;font-size:13px;font-weight:800;color:var(--or)}
.mg-add-wrap{display:flex;align-items:center;gap:6px}
.mg-cnt{font-family:'Unbounded',sans-serif;font-size:11px;font-weight:800;color:var(--g);background:var(--gl);border-radius:5px;padding:2px 7px;display:none}
.mg-cnt.show{display:block}
.mg-add{width:28px;height:28px;background:var(--or);border:none;border-radius:8px;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.13s;flex-shrink:0}
.mg-add:hover{transform:scale(1.15);background:var(--or2)}

.cart-ov{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(5px);z-index:350;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.22s}
.cart-ov.show{opacity:1;pointer-events:all}
.cart-modal{width:560px;max-height:85vh;background:var(--s1);border:1px solid var(--bd2);border-radius:20px;display:flex;flex-direction:column;transform:scale(.95) translateY(10px);transition:.26s cubic-bezier(.4,0,.2,1);overflow:hidden}
.cart-ov.show .cart-modal{transform:scale(1) translateY(0)}
.cm-hd{padding:18px 22px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.cm-hd h3{font-family:'Unbounded',sans-serif;font-size:16px;font-weight:800}
.cm-hd-r{display:flex;align-items:center;gap:10px}
.cm-cnt-chip{background:var(--orl);color:var(--or);border:1px solid var(--orb);border-radius:20px;padding:3px 11px;font-size:12px;font-weight:800;font-family:'Unbounded',sans-serif}
.cm-close{width:30px;height:30px;background:var(--s2);border:none;color:var(--t2);border-radius:50%;cursor:pointer;font-size:14px;transition:.13s}
.cm-close:hover{background:var(--r);color:#fff}
.cm-body{flex:1;overflow-y:auto;padding:14px 22px}
.cm-empty{text-align:center;padding:40px;color:var(--t2)}
.cm-empty span{font-size:48px;display:block;margin-bottom:12px;opacity:.3}
.ci{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--bd)}
.ci-img{width:52px;height:52px;border-radius:9px;background-size:cover;background-position:center;flex-shrink:0;background-color:var(--s3)}
.ci-info{flex:1;min-width:0}
.ci-name{font-size:13px;font-weight:700;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-sub{font-size:11px;color:var(--t2)}
.ci-price{font-family:'Unbounded',sans-serif;font-size:13px;font-weight:800;color:var(--or);white-space:nowrap}
.qty{display:flex;align-items:center;gap:7px}
.qb{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--bd2);background:none;color:var(--t1);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.12s;line-height:1}
.qb:hover{border-color:var(--or);background:var(--orl);color:var(--or)}
.qn{font-family:'Unbounded',sans-serif;font-size:13px;font-weight:700;min-width:18px;text-align:center}
.cm-ft{padding:16px 22px;border-top:1px solid var(--bd);flex-shrink:0}
.cm-ft-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:14px}
.cm-field label{display:block;font-size:10px;font-weight:800;color:var(--t2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.8px}
.cm-field input,.cm-field select{width:100%;padding:10px 12px;background:var(--s2);border:1.5px solid var(--bd);border-radius:9px;color:var(--t1);font-size:13px;font-family:'Nunito',sans-serif;outline:none;transition:.15s}
.cm-field input:focus,.cm-field select:focus{border-color:var(--or)}
.cm-field select option{background:var(--s2)}
.cm-field.full{grid-column:span 2}
.cm-tot{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cm-tot span:first-child{font-size:14px;color:var(--t2);font-weight:600}
.cm-tot span:last-child{font-family:'Unbounded',sans-serif;font-size:20px;font-weight:900;color:var(--or)}
.obtn{width:100%;padding:14px;background:var(--or);border:none;border-radius:12px;color:#fff;font-family:'Unbounded',sans-serif;font-weight:700;font-size:14px;cursor:pointer;transition:.17s}
.obtn:hover{background:var(--or2)}

.status-card{background:var(--s2);border:1px solid var(--bd);border-radius:13px;padding:16px 18px;margin-bottom:10px}
.sc-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sc-id{font-family:'Unbounded',sans-serif;font-size:12px;font-weight:700}
.bdg{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.bdg.wait{background:var(--yl);color:var(--y)}
.bdg.acc{background:var(--orl);color:var(--or)}
.bdg.cook{background:var(--bll);color:var(--bl)}
.bdg.pickup{background:rgba(168,85,247,.15);color:#C084FC}
.bdg.ondel{background:var(--orl);color:var(--or)}
.bdg.done{background:var(--gl);color:var(--g)}
.sc-steps{display:flex;margin-bottom:12px}
.sst{flex:1;text-align:center;font-size:10px;color:var(--t3);position:relative}
.sst:not(:last-child)::after{content:'';position:absolute;top:9px;left:50%;right:-50%;height:2px;background:var(--bd);z-index:0}

/* ================================================================
   FIREBASE HELPERS
================================================================ */
async function fbGet(path) {
  const snap = await get(ref(db, path));
  return snap.exists() ? snap.val() : null;
}
async function fbSet(path, data) {
  await set(ref(db, path), data);
}
async function fbUpdate(path, data) {
  await update(ref(db, path), data);
}
async function fbPush(path, data) {
  const r = await push(ref(db, path), data);
  return r.key;
}
function fbListen(path, cb) {
  const r = ref(db, path);
  onValue(r, snap => cb(snap.exists() ? snap.val() : null));
  listeners.push(r);
}
function detachListeners() {
  listeners.forEach(r => off(r));
  listeners = [];
}

async function getMenu(restId) {
  const m = await fbGet('menus/' + restId);
  if (m) return m;
  // First time — save defaults
  const def = restId === 'rest1' ? DEFAULT_MENU_REST1 : DEFAULT_MENU_REST2;
  await fbSet('menus/' + restId, def);
  return def;
}
async function setMenu(restId, menu) {
  await fbSet('menus/' + restId, menu);
}

async function getOrders() {
  const o = await fbGet('orders');
  if (!o) return [];
  return Object.entries(o).map(([k, v]) => ({...v, _key: k})).sort((a,b) => b.ts - a.ts);
}

async function getCourierShift() {
  const v = await fbGet('shift/courier2');
  return !!v;
}
async function setCourierShift(val) {
  await fbSet('shift/courier2', val);
}

}

/* ================================================================
   CART
================================================================ */
window.addCartFromBtn = function(btn) {
  const {id, name, price, img, rest} = btn.dataset;
  if (cartRestId && cartRestId !== rest && cart.length > 0) {
    if (!confirm('Кошик містить товари з іншого ресторану. Очистити кошик?')) return;
    cart = []; cartRestId = null;
  }
  cartRestId = rest;
  addCart({id, name, price: parseInt(price), img});
};

function addCart(item) {
  const ex = cart.find(x => x.id === item.id);
  if (ex) ex.qty++; else cart.push({...item, qty: 1});
  const inCart = cart.find(x => x.id === item.id);
  const cntEl = document.getElementById('mgcnt-' + item.id);
  if (cntEl) { cntEl.textContent = '×' + inCart.qty; cntEl.classList.add('show'); }
  updateCartUI(true);
  showToast('✅ ' + item.name + ' додано');
}

function updateCartUI(bump) {
  const total = cart.reduce((s,x) => s + x.price * x.qty, 0);
  const cnt = cart.reduce((s,x) => s + x.qty, 0);
  const btn = document.getElementById('cartBarBtn');
  const totEl = document.getElementById('cartTotVal');
  const ftEl = document.getElementById('cartFt');
  const chip = document.getElementById('cartCntChip');
  if (totEl) totEl.textContent = total + ' грн';
  if (ftEl) ftEl.style.display = cnt > 0 ? 'block' : 'none';
  if (chip) chip.textContent = cnt + ' ' + (cnt===1?'товар':cnt<5?'товари':'товарів');
  if (btn) {
    if (cnt > 0) {
      btn.className = 'cart-btn filled' + (bump ? ' bump' : '');
      btn.innerHTML = `<span class="cart-icon-wrap">🛒</span><span class="cart-label">${total} грн</span><span class="cart-cnt-wrap"><span class="cart-cnt">${cnt}</span></span>`;
      if (bump) btn.addEventListener('animationend', () => btn.classList.remove('bump'), {once:true});
    } else {
      btn.className = 'cart-btn empty';
      btn.innerHTML = `<span style="font-size:16px">🛒</span><span style="font-size:13px;font-weight:700">Кошик</span>`;
    }
    btn.onclick = openCart;
  }
}

function renderCartBody() {
  const b = document.getElementById('cartBody'); if (!b) return;
  if (!cart.length) { b.innerHTML = '<div class="cm-empty"><span>🛒</span><p>Кошик порожній</p></div>'; return; }
  const restName = cartRestId ? RESTAURANTS[cartRestId]?.name : '';
  b.innerHTML = (restName ? `<div style="font-size:11px;color:var(--t2);margin-bottom:10px">🍴 ${restName}</div>` : '') +
    cart.map(x => `<div class="ci">
      <div class="ci-img" style="background-image:url('${x.img}')"></div>
      <div class="ci-info"><div class="ci-name">${x.name}</div><div class="ci-sub">${x.price} грн × ${x.qty}</div></div>
      <div class="qty">
        <button class="qb" onclick="qtyChg('${x.id}',-1)">−</button>
        <span class="qn">${x.qty}</span>
        <button class="qb" onclick="qtyChg('${x.id}',1)">+</button>
      </div>
      <div class="ci-price">${x.price * x.qty} грн</div>
    </div>`).join('');
}

window.qtyChg = function(id, d) {
  const i = cart.findIndex(x => x.id === id); if (i < 0) return;
  cart[i].qty += d;
  if (cart[i].qty <= 0) cart.splice(i, 1);
  if (!cart.length) cartRestId = null;
  updateCartUI(false); renderCartBody();
  const el = document.getElementById('mgcnt-' + id);
  if (el) { const inCart = cart.find(x => x.id === id); if (inCart) { el.textContent = '×'+inCart.qty; el.classList.add('show'); } else el.classList.remove('show'); }
};

window.openCart = function() { document.getElementById('cartOv').classList.add('show'); renderCartBody(); };
window.closeCart = function() { document.getElementById('cartOv').classList.remove('show'); };

window.placeOrder = async function() {
  const addr = document.getElementById('addrIn')?.value?.trim();
  const pay = document.getElementById('payIn')?.value;
  if (!addr) { showToast('⚠️ Вкажіть адресу'); return; }
  if (!cart.length) return;
  const total = cart.reduce((a,x) => a + x.price * x.qty, 0);
  const rInfo = RESTAURANTS[cartRestId || 'rest1'];
  const ord = {
    clientId: CU,
    restId: cartRestId || 'rest1',
    restName: rInfo?.name || '',
    items: cart.map(x => ({id:x.id, n:x.name, p:x.price, q:x.qty})),
    total, addr, pay,
    status: 'wait',
    courierId: null,
    ts: Date.now()
  };
  showToast('⏳ Оформлюємо…');
  await fbPush('orders', ord);
  cart = []; cartRestId = null;
  updateCartUI(false); renderCartBody(); closeCart();
  showToast('🎉 Замовлення оформлено!');
  nav('orders', document.getElementById('nl-orders'));
};

function startOrdersListener() {
  fbListen('orders', (data) => {
    // rebuild orders array
    window._orders = data ? Object.entries(data).map(([k,v]) => ({...v, _key:k})).sort((a,b) => b.ts - a.ts) : [];
    updateBadges();
    // auto-refresh active pages
    const r = ACC[CU].role;
    if (document.getElementById('pg-orders')?.classList.contains('on')) renderOrders();
    if (document.getElementById('pg-cafe-orders')?.classList.contains('on')) renderCafeOrders();
    if (document.getElementById('pg-cur-list')?.classList.contains('on')) renderCurList();
    if (document.getElementById('pg-cur-active')?.classList.contains('on')) renderCurActive();
    if (document.getElementById('pg-adm-stats')?.classList.contains('on')) renderAdmStats();
    if (document.getElementById('pg-adm-orders')?.classList.contains('on')) renderAdmOrders();
  });
}

function getOrders() { return window._orders || []; }

================================================================ */
function renderOrders() {
  const el = document.getElementById('orders-list'); if (!el) return;
  const all = getOrders();
  const mine = all.filter(o => o.clientId === CU);
  const active = mine.filter(o => o.status !== 'done');

  const el2 = document.getElementById('cl-ord'); if (el2) el2.textContent = mine.length;
  const el3 = document.getElementById('cl-sp'); if (el3) el3.textContent = mine.filter(o=>o.status==='done').reduce((a,o)=>a+o.total,0);

  if (!active.length) { el.innerHTML = '<div class="empty"><span class="em">📋</span><h3>Активних замовлень немає</h3></div>'; renderClientHistory(); return; }

  const labels = {wait:'Очікує',acc:'Прийнято',cook:'Готується',pickup:'Готово',ondel:'В дорозі',done:'Доставлено'};
  const steps = ['Очікує','Прийнято','Готується','Готово','В дорозі','Доставлено'];
  const skeys = ['wait','acc','cook','pickup','ondel','done'];
  el.innerHTML = active.map(o => {
    const si = skeys.indexOf(o.status);
    const stepsH = steps.map((st,i) => `<div class="sst ${i<si?'done':i===si?'active':''}"><div class="dot">${i<si?'✓':''}</div><div>${st}</div></div>`).join('');
    const chatH = o.courierId ? `<div class="chat-box">
      <div class="chat-hd">💬 Чат з кур'єром</div>
      <div class="chat-msgs" id="cm-${o._key}">${renderMsgs(o._key)}</div>
      <div class="chat-in">
        <input type="text" id="ci-${o._key}" placeholder="Написати…" onkeydown="if(event.key==='Enter')sendMsg('${o._key}','client')">
        <button onclick="sendMsg('${o._key}','client')">→</button>
      </div>
    </div>` : '';
    return `<div class="status-card">
      <div class="sc-hd"><div class="sc-id">#${o._key?.slice(-4)} · ${o.restName}</div><span class="bdg ${o.status}">${labels[o.status]||o.status}</span></div>
      <div class="sc-steps">${stepsH}</div>
      <div class="sc-info"><b>Страви:</b> ${o.items.map(i=>i.n+'×'+i.q).join(', ')}<br><b>Адреса:</b> ${o.addr} · <b>Сума:</b> ${o.total} грн</div>
      ${chatH}
    </div>`;
  }).join('');
  renderClientHistory();
}

function renderClientHistory() {
  const el = document.getElementById('client-history'); if (!el) return;
  const done = getOrders().filter(o => o.clientId === CU && o.status === 'done');
  if (!done.length) { el.innerHTML = '<div class="empty"><span class="em">📋</span><h3>Виконаних замовлень немає</h3></div>'; return; }
  el.innerHTML = done.map(o => {
    const d = new Date(o.ts);
    const ds = d.toLocaleDateString('uk',{day:'2-digit',month:'2-digit',year:'2-digit'}) + ' ' + d.toLocaleTimeString('uk',{hour:'2-digit',minute:'2-digit'});
    return `<div class="hist-item">
      <div class="hist-hd" onclick="toggleHist('ch-${o._key}',this)">
        <div class="hist-hd-l"><div class="hist-hd-icon">🧾</div><div><div class="hist-hd-id">#${o._key?.slice(-4)} · ${o.total} грн · ${o.restName}</div><div class="hist-hd-date">${ds}</div></div></div>
        <div class="hist-hd-r"><span class="bdg done">Доставлено</span><span class="hist-arrow">▼</span></div>
      </div>
      <div class="hist-body" id="ch-${o._key}">
        <div style="font-size:12px;color:var(--t2)"><b style="color:var(--t1)">Страви:</b> ${o.items.map(i=>i.n+'×'+i.q).join(', ')}</div>
      </div>
    </div>`;
  }).join('');
}

function renderMsgs(ordKey) {
  const o = getOrders().find(x => x._key === ordKey);
  const msgs = o?.chats ? Object.values(o.chats) : [];
  if (!msgs.length) return '<p style="font-size:11px;color:var(--t3);text-align:center;margin:auto">Немає повідомлень</p>';
  return msgs.sort((a,b) => a.ts - b.ts).map(m => `<div class="msg ${m.from===CU?'me':'them'}"><div class="mwho">${m.fromName}</div>${m.text}</div>`).join('');
}

window.sendMsg = async function(ordKey, role) {
  const inp = document.getElementById('ci-' + ordKey); if (!inp) return;
  const text = inp.value.trim(); if (!text) return;
  inp.value = '';
  await fbPush('orders/' + ordKey + '/chats', {from: CU, fromName: ACC[CU].name, text, ts: Date.now()});
};

/* ================================================================
   ADMIN STATS
================================================================ */
function renderAdmStats() {
  const el = document.getElementById('adm-stats-body'); if (!el) return;
  const all = getOrders();
  const total = all.length;
  const done = all.filter(o => o.status === 'done').length;
  const active = all.filter(o => o.status !== 'done').length;
  const revenue = all.filter(o => o.status === 'done').reduce((a,o) => a + o.total, 0);
  el.innerHTML = `
    <div class="adm-stat-grid">
      <div class="adm-stat or"><div class="adm-stat-n">${total}</div><div class="adm-stat-l">Всього замовлень</div></div>
      <div class="adm-stat g"><div class="adm-stat-n">${done}</div><div class="adm-stat-l">Виконано</div></div>
      <div class="adm-stat bl"><div class="adm-stat-n">${active}</div><div class="adm-stat-l">Активних</div></div>
      <div class="adm-stat y"><div class="adm-stat-n">${revenue}</div><div class="adm-stat-l">грн Виручка</div></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px">
      ${['wait','acc','cook','pickup','ondel','done'].map(st => {
        const lbl = {wait:'Очікує',acc:'Прийнято',cook:'Готується',pickup:'Готово',ondel:'В дорозі',done:'Доставлено'};
        const cnt = all.filter(o => o.status === st).length;
        return `<div style="background:var(--s2);border:1px solid var(--bd);border-radius:11px;padding:13px;text-align:center">
          <div style="font-family:'Unbounded',sans-serif;font-size:20px;font-weight:900;margin-bottom:6px">${cnt}</div>
          <span class="bdg ${st}">${lbl[st]}</span></div>`;
      }).join('')}
    </div>`;
}

function renderAdmOrders() {
  const el = document.getElementById('adm-orders-body'); if (!el) return;
  const all = getOrders();
  if (!all.length) { el.innerHTML = '<div class="empty"><span class="em">📭</span><h3>Замовлень немає</h3></div>'; return; }
  const lbl = {wait:'Очікує',acc:'Прийнято',cook:'Готується',pickup:'Готово',ondel:'В дорозі',done:'Доставлено'};
  el.innerHTML = `<table class="atab"><thead><tr><th>#</th><th>Ресторан</th><th>Адреса</th><th>Сума</th><th>Статус</th><th>Кур'єр</th></tr></thead><tbody>
    ${all.map(o => `<tr><td><b>${o._key?.slice(-4)}</b></td><td>${o.restName||''}</td><td>${o.addr}</td><td>${o.total} грн</td><td><span class="bdg ${o.status}">${lbl[o.status]||o.status}</span></td><td>${o.courierId?ACC[o.courierId]?.name:'—'}</td></tr>`).join('')}
  </tbody></table>`;
}

/* ================================================================
   DIRECTOR
================================================================ */
function buildDirector() {
  const acc = ACC[CU];
  const restName = RESTAURANTS[acc.restId]?.name || 'Ресторан';
  document.getElementById('mainArea').innerHTML = `
    <div class="topbar"><div class="city" style="margin-left:0">👔 Директор — ${restName}</div></div>
    <div id="pagesArea">
      <div class="pg on" id="pg-dir-menu"><div class="w">
        <div class="sh"><h2>Меню ресторану</h2></div>
        <div id="dir-menu-body"></div>
        <div class="add-form" id="dir-add-form"></div>
      </div></div>
      <div class="pg" id="pg-dir-stats"><div class="w"><div class="sh"><h2>Статистика</h2></div><div id="dir-stats-body"></div></div></div>
    </div>`;
  startOrdersListener();
  renderDirMenu();
  renderDirStats();
}

function getDirRestId() {
  const sel = document.getElementById('admDirRestSel');
  if (sel) return sel.value;
  return ACC[CU]?.restId || 'rest1';
}

async function renderDirMenu() {
  const el = document.getElementById('dir-menu-body'); if (!el) return;
  const restId = getDirRestId();
  const menu = await getMenu(restId);
  let h = '';
  Object.entries(menu).forEach(([cat, items]) => {
    h += `<div class="menu-cat-hd">${cat} · ${items.length}</div>`;
    h += items.map(i => `<div class="me-item"><div class="me-img" style="background-image:url('${i.img}')"></div><div class="me-info"><div class="me-nm">${i.n}</div><div class="me-pr">${i.p} грн</div></div><button class="me-del" onclick="delItem('${restId}','${cat}','${i.id}')">✕</button></div>`).join('');
  });
  el.innerHTML = h;
  const af = document.getElementById('dir-add-form');
  if (af) af.innerHTML = `<h4>➕ Додати позицію</h4>
    <div class="frow"><div class="ff"><label>Категорія</label><input id="nc" placeholder="Піца / Салати…"></div><div class="ff"><label>Назва</label><input id="nn" placeholder="Назва страви"></div></div>
    <div class="frow"><div class="ff"><label>Опис</label><input id="nd" placeholder="Склад…"></div><div class="ff"><label>Ціна (грн)</label><input id="np" type="number" placeholder="150"></div></div>
    <div class="frow"><div class="ff" style="grid-column:span 2"><label>URL зображення</label><input id="ni" placeholder="https://…"></div></div>
    <button class="sv-btn" onclick="addItem('${restId}')">Додати</button>`;
}

window.delItem = async function(restId, cat, id) {
  if (!confirm('Видалити?')) return;
  const menu = await getMenu(restId);
  if (menu[cat]) { menu[cat] = menu[cat].filter(x => x.id !== id); if (!menu[cat].length) delete menu[cat]; }
  await setMenu(restId, menu);
  renderDirMenu();
  showToast('🗑️ Видалено');
};

window.addItem = async function(restId) {
  const cat = document.getElementById('nc')?.value?.trim();
  const n = document.getElementById('nn')?.value?.trim();
  const d = document.getElementById('nd')?.value?.trim();
  const p = parseInt(document.getElementById('np')?.value);
  const img = document.getElementById('ni')?.value?.trim() || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300&q=70';
  if (!cat || !n || !p) { showToast('⚠️ Заповніть всі поля'); return; }
  const menu = await getMenu(restId);
  if (!menu[cat]) menu[cat] = [];
  menu[cat].push({id: 'x' + Date.now(), n, d, p, img});
  await setMenu(restId, menu);
  ['nc','nn','nd','np','ni'].forEach(id => { const e = document.getElementById(id); if (e) e.value = ''; });
  renderDirMenu();
  showToast('✅ Додано');
};

async function renderDirStats() {
  const el = document.getElementById('dir-stats-body'); if (!el) return;
  const all = getOrders();
  const isAdmin = ACC[CU].role === 'admin';
  const rids = isAdmin ? Object.keys(RESTAURANTS) : [ACC[CU].restId];
  let h = '';
  rids.forEach(rid => {
    const r = RESTAURANTS[rid];
    const mine = all.filter(o => o.restId === rid);
    const done = mine.filter(o => o.status === 'done');
    h += `<div class="sh" style="margin-top:18px"><h2>${r.name}</h2></div>
      <div class="stats-row">
        <div class="stat-c"><div class="stat-n">${mine.length}</div><div class="stat-l">всього</div></div>
        <div class="stat-c"><div class="stat-n">${done.length}</div><div class="stat-l">виконано</div></div>
        <div class="stat-c"><div class="stat-n">${done.reduce((a,o)=>a+o.total,0)}</div><div class="stat-l">грн виручка</div></div>
      </div>`;
  });
  el.innerHTML = h || '<p style="color:var(--t2)">Немає даних</p>';
}

/* ================================================================
   UTILS
================================================================ */
function updateBadges() {
  const r = ACC[CU].role;
  const all = getOrders();
  if (r === 'client' || r === 'admin') setBdg('bdg-orders', all.filter(o => o.clientId===CU && o.status!=='done').length);
  if (r === 'cafe') setBdg('bdg-cafe', all.filter(o => o.restId===ACC[CU].restId && ['wait','acc','cook'].includes(o.status)).length);
  if (r === 'courier') {
    setBdg('bdg-cur', all.filter(o => !o.courierId && ['cook','pickup'].includes(o.status)).length);
    const act = all.find(o => o.courierId===CU && ['cook','pickup','ondel'].includes(o.status));
    setBdg('bdg-cur-act', act ? 1 : 0, true);
  }
}

function setBdg(id, cnt, isGreen) {
  const el = document.getElementById(id); if (!el) return;
  if (cnt > 0) { el.textContent = cnt; el.classList.add('show'); if (isGreen) el.classList.add('green'); }
  else el.classList.remove('show');
}

window.toggleHist = function(id, hd) {
  const body = document.getElementById(id);
  const arrow = hd.querySelector('.hist-arrow');
  if (body) { body.classList.toggle('open'); if (arrow) arrow.classList.toggle('open'); }
};

function renderProfile() {
  const r = ACC[CU].role;
  if (r === 'courier') renderCourierProfile();
  if (r === 'client') renderClientHistory();
}

let toastT;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200);
}
window.showToast = showToast;

// Expose render functions globally for nav()
window.renderOrders = renderOrders;
window.renderCafeOrders = renderCafeOrders;
window.renderCafeMenuView = renderCafeMenuView;
window.renderCurList = renderCurList;
window.renderCurActive = renderCurActive;
window.renderAdmStats = renderAdmStats;
window.renderAdmOrders = renderAdmOrders;
window.renderDirMenu = renderDirMenu;
window.renderDirStats = renderDirStats;
window.renderProfile = renderProfile;
window.renderRestCards = renderRestCards;

// init
window._orders = [];
window._onShift = false;

// Init shift state from Firebase on load
async function initShift() {
  window._onShift = await getCourierShift();
}
initShift();

// Hide loading, show auth
document.getElementById('loadingScreen').style.display = 'none';
document.getElementById('authScreen').style.display = 'flex';

window.doLogin = doLogin;
</script>
